name: Auto Build

on:
  push:
    branches:
      - main
    paths:
      - '**'
      # - '!**/assets/**'
      # - '!**.md'
      - '!**/ISSUE_TEMPLATE/**'
      - '!**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_run:
    workflows: [Build Web]
    branches: [master]
    types:
      - completed
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: '构建完成后创建 GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  prepare:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    outputs:
      versionL: ${{ steps.set-ver.outputs.full_version_name }}
      version: ${{ steps.set-ver.outputs.current_version }}
      build_number: ${{ steps.set-ver.outputs.build_number }}
      version_code: ${{ steps.set-ver.outputs.version_code }}
      latest_tag: ${{ steps.set-ver.outputs.last_tag }}
      is_release: ${{ steps.set-ver.outputs.is_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 计算版本号和构建号
        id: set-ver
        run: |
          PROPERTIES_FILE="./app/version.properties"
          if [[ ! -f "$PROPERTIES_FILE" ]]; then
            echo "错误：version.properties 文件不存在于 $PROPERTIES_FILE"
            exit 1
          fi
          
          # --- 1. 读取基础版本和发布标志 ---
          MAJOR=$(cat "$PROPERTIES_FILE" | grep 'VERSION_MAJOR' | cut -d'=' -f2 | tr -d '[:space:]')
          MINOR=$(cat "$PROPERTIES_FILE" | grep 'VERSION_MINOR' | cut -d'=' -f2 | tr -d '[:space:]')
          PATCH=$(cat "$PROPERTIES_FILE" | grep 'VERSION_PATCH' | cut -d'=' -f2 | tr -d '[:space:]')
          RELEASE_FLAG=$(cat "$PROPERTIES_FILE" | grep 'VERSION_SUFFIX' | cut -d'=' -f2 | tr -d '[:space:]')
          
          CURRENT_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_BUILD_NUM=0
          VERSION_SUFFIX_NAME=""
          IS_RELEASE="false" # 默认为 Pre-release
          
          # 2. 确定版本类型和后缀
          if [[ "${RELEASE_FLAG}" == "0" ]]; then
            # 标记为正式版 (VERSION_SUFFIX=0)
            VERSION_SUFFIX_NAME=""
            IS_RELEASE="true"
            echo "版本类型: 正式版 (Release), 版本名: $CURRENT_VERSION"
          
            # 找到最近的正式版本 tag 作为日志起点
            LAST_TAG_FOR_LOG=$(git tag --list "$MAJOR.$MINOR.*" --sort=-committerdate | grep -vi 'beta' | head -n 2 | tail -n 1)
            if [ -z "$LAST_TAG_FOR_LOG" ]; then
                # 如果找不到上一个正式版，则从最近的非本次构建的 tag 开始
                LAST_TAG_FOR_LOG=$(git tag --sort=-committerdate | head -n 2 | tail -n 1)
            fi
          
          elif [[ ("${{ github.event_name }}" == "push" || "${{ inputs.publish }}" == "true") && "${{ github.ref }}" == "refs/heads/main" ]]; then
            # 标记为测试版 (VERSION_SUFFIX=1 或其他/空)，且在 main 分支推送
          
            # 查找匹配当前 CURRENT_VERSION 的上一个 BETA TAG (e.g., 3.26.4-Beta.X)
            LAST_MATCHING_TAG=$(git tag --list "$CURRENT_VERSION-Beta.*" --sort=-committerdate | head -n 1)
          
            if [[ $LAST_MATCHING_TAG =~ [0-9]+\.[0-9]+\.[0-9]+-Beta\.([0-9]+) ]]; then
              LAST_BUILD_NUM="${BASH_REMATCH[1]}"
              NEW_BUILD_NUM=$((LAST_BUILD_NUM + 1))
            else
              NEW_BUILD_NUM=1
            fi
          
            VERSION_SUFFIX_NAME="-Beta.$NEW_BUILD_NUM"
          
            # 日志从最近的任意 TAG 开始 (包括上一个 Beta.x tag)
            LAST_ANY_TAG=$(git tag --sort=-committerdate | head -n 1)
            LAST_TAG_FOR_LOG="${LAST_ANY_TAG#v}"
            echo "版本类型: 预发布版 (Pre-release), 构建号: $NEW_BUILD_NUM"
          
          else
            # 其它情况 (PR, 非 main 分支推送等)，构建号设为 0
            NEW_BUILD_NUM=0
            LAST_ANY_TAG=$(git tag --sort=-committerdate | head -n 1)
            LAST_TAG_FOR_LOG="${LAST_ANY_TAG#v}"
            echo "非 main 分支推送/PR，构建号设置为 $NEW_BUILD_NUM"
          fi
          
          # 3. 构造最终版本信息
          FULL_VERSION_NAME="${CURRENT_VERSION}${VERSION_SUFFIX_NAME}"
          
          # 按渠道读取对应的 versionCode（正式/测试各自独立递增）
          VCODE_RELEASE=$(grep '^VERSION_CODE_RELEASE' "$PROPERTIES_FILE" | cut -d'=' -f2 | tr -d '[:space:]')
          VCODE_BETA=$(grep '^VERSION_CODE_BETA' "$PROPERTIES_FILE" | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ "$IS_RELEASE" == "true" ]]; then
            VERSION_CODE="$VCODE_RELEASE"
          else
            VERSION_CODE="$VCODE_BETA"
          fi

          # 4. 设置输出供后续作业使用
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "full_version_name=$FULL_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$NEW_BUILD_NUM" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG_FOR_LOG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT

      # 仅在真正的发布流程里，把对应渠道的 versionCode +1 并回写仓库（下次发布接着递增）
      - name: 递增 versionCode 并回写
        if: inputs.publish
        run: |
          FILE="app/version.properties"
          if [[ "${{ steps.set-ver.outputs.is_release }}" == "true" ]]; then
            KEY="VERSION_CODE_RELEASE"
          else
            KEY="VERSION_CODE_BETA"
          fi
          CUR=$(grep "^$KEY=" "$FILE" | cut -d'=' -f2 | tr -d '[:space:]')
          NEW=$((CUR + 1))
          sed -i "s/^$KEY=.*/$KEY=$NEW/" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(release): bump $KEY to $NEW [skip ci]"
          git push

  build:
    needs: prepare
    strategy:
      matrix:
        product: [ app ]
        type: [ release, releaseA, releaseB ]
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      product: ${{ matrix.product }}
      type: ${{ matrix.type }}
      # 使用 prepare job 的输出
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSIONL: ${{ needs.prepare.outputs.versionL }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "">$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt
      - name: Release Apk Sign
        if: ${{ github.actor == 'ZYO122' }}
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d >"$GITHUB_WORKSPACE/app/my-release-key.jks"

          {
            echo ""
            echo "RELEASE_STORE_FILE=my-release-key.jks"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build With Gradle
        run: |
          echo "开始 ${{ env.product }} ${{ env.type }} 构建"
          echo "VersionName: $APP_VERSION_NAME"
          echo "VersionCode: $VERSION_CODE"
          chmod +x gradlew
          # 首字母大写以匹配 Gradle Task（app->App, releaseA->ReleaseA）
          PRODUCT_CAP=$(echo ${{ env.product }} | awk '{print toupper(substr($0,1,1))substr($0,2)}')
          TYPE_CAP=$(echo ${{ env.type }} | awk '{print toupper(substr($0,1,1))substr($0,2)}')
          ./gradlew assemble${PRODUCT_CAP}${TYPE_CAP} -PversionCode=${{ env.VERSION_CODE }} -PenableAbiSplits=false --no-configuration-cache
        env:
          APP_VERSION_NAME: ${{ env.VERSIONL }}
          VERSION_CODE: ${{ env.VERSION_CODE }}

      - name: Move Mapping Files
        if: matrix.type == 'release'
        run: |
          echo "移动 mapping 相关文件"
          MAPPING_DIR="${{ github.workspace }}/mapping"
          mkdir -p "$MAPPING_DIR"
          # 使用 find 代替 ls，避免参数列表过长
          find ${{ github.workspace }}/app/build/outputs/mapping/ -name "missing_rules.txt" -exec mv {} "$MAPPING_DIR/missing_rules.txt" \;
          find ${{ github.workspace }}/app/build/outputs/mapping/ -name "mapping.txt" -exec mv {} "$MAPPING_DIR/mapping.txt" \;

      - name: Upload Missing Rules File To Artifact
        if: matrix.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: legado.${{ env.product }}.${{ env.type }}.mapping.missing_rules
          if-no-files-found: ignore
          path: ${{ github.workspace }}/mapping/missing_rules.txt

      - name: Check Build production
        run: |
          echo "检查 APK 输出目录"
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.product }}/${{ env.type }}"
          # 检查是否有任何 APK 文件生成
          if [ -z "$(find "$APK_PATH" -name "*.apk" -print -quit)" ]; then
            echo "Build production not found! Check gradle logs."
            exit 1
          fi

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-apk-${{ env.type }}
          if-no-files-found: error
          path: app/build/outputs/apk/${{ env.product }}/${{ env.type }}/*.apk

      - name: Upload Mapping File To Artifact
        if: matrix.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: legado.${{ env.product }}.${{ env.type }}.mapping
          if-no-files-found: ignore
          path: ${{ github.workspace }}/mapping/mapping.txt

      - name: Save release metadata
        if: matrix.type == 'release'
        run: |
          {
            echo "VERSIONL=${{ needs.prepare.outputs.versionL }}"
            echo "LATEST_TAG=${{ needs.prepare.outputs.latest_tag }}"
            echo "IS_RELEASE=${{ needs.prepare.outputs.is_release }}"
          } > release-metadata.env

      - name: Upload Release Metadata
        if: matrix.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          if-no-files-found: error
          path: release-metadata.env

  create_release:
    needs: [ prepare, build ]
    # 只有 Release APK workflow 调用时才发布；普通 Auto Build 仍然只构建产物。
    if: inputs.publish && github.actor == 'ZYO122' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 1. 下载 build 任务上传的所有 APK
      - name: 下载所有 APK Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-apk-*'
          path: artifacts
          merge-multiple: false

      # 2. 下载 mapping 文件
      - name: 下载 Mapping Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'legado.app.release.mapping*'
          path: artifacts
          merge-multiple: true

      # 3. 重命名逻辑
      - name: 整理并重命名 APK 文件
        id: organize_apks
        run: |
          VERSIONL="${{ needs.prepare.outputs.versionL }}"
          echo "正在整理 APK 文件..."
          if [ ! -d artifacts ]; then
            echo "::error::artifacts 目录不存在，说明上一步没有下载到 APK。"
            exit 1
          fi
          shopt -s nullglob
          for dir in artifacts/*-apk-release*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            # 渠道后缀：releaseA -> -A，releaseB -> -B，release -> 无
            case "$name" in
              *-releaseA) vsuffix="-A" ;;
              *-releaseB) vsuffix="-B" ;;
              *) vsuffix="" ;;
            esac
            apk="$(ls "$dir"/*.apk 2>/dev/null | head -1)"
            if [ -z "$apk" ]; then
              echo "::warning::$name 下没有 APK 文件"
              continue
            fi
            mv "$apk" "artifacts/MAO-${VERSIONL}${vsuffix}.apk"
          done

          ls -l artifacts

      #
      # 获取 Commit 记录并格式化为 Release Body
      #
      - name: 获取 Commit 记录
        id: get_commits
        run: |
          LAST_TAG="${{ needs.prepare.outputs.latest_tag }}"
          IS_RELEASE="${{ needs.prepare.outputs.is_release }}"
          # 发布说明只收面向用户的条目：仅保留 feat / fix，并去掉 feat: / feat(书架): 这类前缀
          # （(书架) 保留为「书架：」）；依赖、cronet 等升级仍然排除
          EXCLUDE_PATTERN='cronet|chrome|依赖|chore\(release\)|\[skip ci\]'
          
          if [ -n "$LAST_TAG" ] && git rev-parse -q --verify "refs/tags/$LAST_TAG" >/dev/null; then
            COMMIT_LOG=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" --no-merges \
              | grep -E '^(feat|fix)(\([^)]*\))?: ' \
              | grep -viE "$EXCLUDE_PATTERN" \
              | sed -E 's/^(feat|fix)\(([^)]*)\): /\2：/; s/^(feat|fix): //' \
              | sed 's/^/* /' || true)
          else
            COMMIT_LOG=$(git log -1 --pretty=format:"%s" \
              | grep -E '^(feat|fix)(\([^)]*\))?: ' \
              | grep -viE "$EXCLUDE_PATTERN" \
              | sed -E 's/^(feat|fix)\(([^)]*)\): /\2：/; s/^(feat|fix): //' \
              | sed 's/^/* /' || true)
          fi
          
          if [ -z "$COMMIT_LOG" ]; then
              CONTENT="- 没有新的 Commit 记录."
          else
              CONTENT="$COMMIT_LOG"
          fi
          
          {
            echo "release_body<<EOF"
            if [[ "$IS_RELEASE" != "true" ]]; then
                echo "**此版本为测试版，会存在不稳定问题。**"
                echo ""
            fi
            echo "### [发布页](${{ github.server_url }}/${{ github.repository }}/releases)"
            echo "### [Telegram 群组](https://t.me/Legado_MAO)"
            echo ""
            echo "### 更新内容"
            echo ""
            echo "$CONTENT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "Release Body 已生成。"

      - name: 创建 Tag
        run: |
          # 检查 Tag 是否已存在，避免重复创建
          if ! git tag -l ${{ needs.prepare.outputs.versionL }} | grep -q ${{ needs.prepare.outputs.versionL }}; then
            git tag ${{ needs.prepare.outputs.versionL }} 
            git push origin ${{ needs.prepare.outputs.versionL }}
          else
            echo "Tag ${{ needs.prepare.outputs.versionL }} 已存在，跳过创建。"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 创建 Release 并上传
      - name: 创建 GitHub Release 并上传文件
        # v2 跑在 Node 20（已弃用），v3 起为 Node 24
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.versionL }}
          name: ${{ needs.prepare.outputs.is_release == 'true' && format('Release {0}', needs.prepare.outputs.versionL) || format('Pre-release {0}', needs.prepare.outputs.versionL) }}
          # 保留 GitHub 生成的贡献者小节（What's Changed / Full Changelog 由下一步剪掉）
          body: ${{ steps.get_commits.outputs.release_body }}
          generate_release_notes: true
          # 生成比较基线：上一个 tag，与 prepare 里算 COMMIT_LOG 用的是同一个
          previous_tag: ${{ needs.prepare.outputs.latest_tag }}
          prerelease: ${{ needs.prepare.outputs.is_release != 'true' }}
          files: |
            artifacts/MAO-${{ needs.prepare.outputs.versionL }}*.apk
            artifacts/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 该 action 不输出 body，只能发布后回查：剪掉 GitHub 自动加的
      # What's Changed / Full Changelog 后写回 Release，保留贡献者小节。
      # 失败不阻断发布（continue-on-error）。
      - name: 取回最终 Release Notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.versionL }}
        run: |
          gh release view "$VERSION" --json body --jq .body > release-raw.md
          # 只留我们自己的「更新内容」+ GitHub 的贡献者小节；
          # What's Changed 与 Full Changelog 与内置更新日志重复，剪掉。
          python3 - "$VERSION" <<'PY'
          import subprocess
          import sys

          tag = sys.argv[1]
          lines = open("release-raw.md", encoding="utf-8").read().splitlines()
          kept = []
          skipping = False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("## What's Changed"):
                  skipping = True
                  continue
              if skipping and stripped.startswith("## "):
                  skipping = False
              if skipping or stripped.startswith("**Full Changelog**"):
                  continue
              kept.append(line)
          body = "\n".join(kept).strip() + "\n"
          with open("release-notes.md", "w", encoding="utf-8") as fh:
              fh.write(body)
          subprocess.run(
              ["gh", "release", "edit", tag, "--notes-file", "release-notes.md"],
              check=True,
          )
          PY
          echo "已取回并修剪 Release Notes: $(wc -c < release-notes.md) 字节"

      - name: 发布静态更新清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.versionL }}
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            CHANNEL="official"
          else
            CHANNEL="beta"
          fi
          bash .github/scripts/publish-update-manifest.sh "$CHANNEL" "$VERSION"
